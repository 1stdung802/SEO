spring.application.name=seo-analyzer
spring.datasource.url=jdbc:mysql://localhost:3306/seo_analyzer?createDatabaseIfNotExist=true
spring.datasource.username=root
 spring.config.import=optional:classpath:secret.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
gemini.model=gemini-3.8-flash
gemini.timeout-seconds=60
pagespeed.strategy=mobile
pagespeed.timeout-seconds=90
